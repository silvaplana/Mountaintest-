<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
:root{--fg:#1d2421;--muted:#5f6b66;--accent:#2f6f4f;--line:#d9dfdc;--card:#f2f4f1;--warm:#e4572e}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:#cfd6d2;font-family:Inter,Roboto,system-ui,sans-serif;color:var(--fg);display:flex;flex-wrap:wrap;gap:28px;width:2120px}

.left{position:absolute;left:0;top:0;bottom:0;right:64px;display:flex;flex-direction:column}

.lodg{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:6px}.lodg .ph{width:70px;height:62px;border-radius:10px;overflow:hidden;flex:none}.lodg svg{width:100%;height:100%}

.dayh{font-size:13px;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}.dayh small{margin-left:auto;font-weight:400}
.cover{height:170px;margin:-6px -12px 0 -14px;position:relative;border-radius:18px 18px 0 0;overflow:hidden;flex:none}.cover svg{position:absolute;inset:0;width:100%;height:100%}.cover .shade{position:absolute;inset:0;background:linear-gradient(#0000 40%,#000b)}

.story{font-size:15px;line-height:1.45;margin:0}
.day{border:1px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:7px}
.day h3{margin:0;font-size:15px;display:flex;align-items:center;gap:6px}.day h3 em{font-style:normal;background:var(--accent);color:#fff;border-radius:8px;font-size:12px;padding:2px 7px}
.fld{display:flex;gap:6px}.fld div{flex:1;background:var(--card);border-radius:10px;padding:5px 4px;text-align:center;font-size:11px;color:var(--muted)}.fld b{display:block;font-size:13px;color:var(--fg);white-space:nowrap}.day h3 em{white-space:nowrap;flex:none}

.prow{display:flex;align-items:center;gap:10px;font-size:14px}.prow .av{width:32px;height:32px;font-size:13px}.prow small{display:block;color:var(--muted);font-size:12px}.prow b{margin-left:auto;font-size:13px}
