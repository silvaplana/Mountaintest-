name: Construire les APK et le site web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site web (proto React)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: capacitor } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: capacitor/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npx vite build --base=./
      - uses: actions/upload-artifact@v4
        with: { name: web, path: capacitor/dist }

  apk-capacitor:
    name: APK Capacitor (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: capacitor/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - working-directory: capacitor
        run: |
          npm ci
          npx vite build
          npx cap sync android
      - working-directory: capacitor/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Renommer l'APK
        run: |
          cp capacitor/android/app/build/outputs/apk/release/*.apk assomoutain-capacitor.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk-capacitor, path: assomoutain-capacitor.apk }

  apk-kotlin:
    name: APK Kotlin natif
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: kotlin-natif } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./gradlew --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk ../assomoutain-kotlin.apk
      - uses: actions/upload-artifact@v4
        with: { name: apk-kotlin, path: assomoutain-kotlin.apk }

  release:
    name: Mettre les APK en téléchargement
    needs: [apk-capacitor, apk-kotlin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Publier la release « latest »
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest assomoutain-capacitor.apk assomoutain-kotlin.apk \
            --title "Dernière version des prototypes" \
            --notes "APK construits automatiquement depuis le commit ${{ github.sha }}. À ouvrir depuis le téléphone pour installer."

  site:
    # Branche « site » = ce que le VPS sert sur https://silvaplana.cloud/mountaintest/
    # (le VPS la récupère toutes les 5 minutes, voir deploy/README.md).
    name: Préparer le site pour le VPS
    needs: [web, apk-capacitor, apk-kotlin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: deploy }
      - uses: actions/download-artifact@v4
        with: { name: web, path: site }
      - uses: actions/download-artifact@v4
        with: { pattern: apk-*, merge-multiple: true, path: site/apk }
      - name: Page de téléchargement des APK
        run: |
          rm -f site/*.map site/assets/*.map
          sed -e "s/@DATE@/$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')/" \
              -e "s/@CAP@/$(du -m site/apk/assomoutain-capacitor.apk | cut -f1)/" \
              -e "s/@KOT@/$(du -m site/apk/assomoutain-kotlin.apk | cut -f1)/" \
              deploy/apk-index.html > site/apk/index.html
      - name: Pousser la branche site
        run: |
          cd site
          git init -q -b site
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Site ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
