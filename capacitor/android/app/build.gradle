apply plugin: 'com.android.application'

android {
    namespace = "fr.assomoutain.rando"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.assomoutain.rando"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Numéro de build GitHub Actions (-PversionCode=…) : sert à détecter les mises à jour (Updater.java).
        versionCode project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 1
        versionName "0.1." + (project.hasProperty('versionCode') ? project.property('versionCode') : '1')
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Clé fixe d'une version à l'autre (sinon Android refuse la mise à jour), voir signing/README.md.
    // Sans clé (build local), signature debug.
    signingConfigs {
        proto {
            if (System.getenv('SIGNING_STORE')) {
                storeFile file(System.getenv('SIGNING_STORE'))
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'proto'
                keyPassword System.getenv('SIGNING_PASSWORD')
                storeType 'pkcs12'
            }
        }
    }
    // Deux applis (spec/play-store.md) : « apk », l'APK des copains (mise à jour par GitHub, SCAN 25) ;
    // « play », la version du Play Store (cloud.silvaplana.mountainbuddies : nom définitif une fois publiée,
    // sans mise à jour maison ni SCAN 25). Les deux peuvent être installées côte à côte.
    flavorDimensions = ["canal"]
    productFlavors {
        apk {
            dimension "canal"
        }
        play {
            dimension "canal"
            applicationId "cloud.silvaplana.mountainbuddies"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('SIGNING_STORE') ? signingConfigs.proto : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // GPS économe (FusedLocationProvider) pour le plugin EcoLocation
    implementation "com.google.android.gms:play-services-location:21.3.0"
    // 📞 Sonnerie des appels (AppelService) ; ne démarre qu'avec google-services.json.
    implementation "com.google.firebase:firebase-messaging:24.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Firebase (sonnerie des appels, notifications) : src/apk/google-services.json pour l'APK. La version Play
// demande sa propre appli dans la console Firebase (src/play/google-services.json) ; sans elle, elle se construit
// quand même, sans notifications (BuddiesPlugin le vérifie).
if (file('src/apk/google-services.json').exists() || file('src/play/google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    googleServices { missingGoogleServicesStrategy = 'WARN' }
}
